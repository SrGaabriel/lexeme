name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustc --version && cargo --version
      - run: cargo test --features dictgen
      - run: cargo build --release --features dictgen

  extractor:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --features dictgen --bin dictgen

      - name: Compile Basque
        run: |
          set -euo pipefail
          url=$(python3 -c "
          import sys; sys.path.insert(0, 'dictionaries')
          from plan import source_url
          print(source_url('Basque'))
          ")
          curl --fail --silent --show-error --location --retry 3 --retry-delay 10 \
               --user-agent "lexeme-dictgen (+https://github.com/${{ github.repository }})" \
               "$url" \
          | ./target/release/dictgen --lang eu --name Basque --source "$url" \
              --out dist/eu.lex.zst --stats dist/eu.stats.json

      - name: Assert the output is sane
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys
          stats = json.load(open("dist/eu.stats.json"))
          print(json.dumps(stats, indent=2, ensure_ascii=False))
          checks = {
              "entries": stats["entries"] > 5_000,
              "forms": stats["forms"] > 10_000,
              "form coverage": stats["pct_with_forms"] > 40,
              "parse errors": stats["parse_errors"] == 0,
          }
          for name, ok in checks.items():
              print(f"{'ok  ' if ok else 'FAIL'} {name}")
          if not all(checks.values()):
              sys.exit("extractor output failed sanity checks")
          EOF
