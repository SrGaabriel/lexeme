[package]
name = "lexeme"
description = "A command line tool for searching through dictionaries"
license-file = "LICENSE"
repository = "https://github.com/SrGaabriel/lexeme"
version = "0.0.3"
edition = "2024"
exclude = [".github/"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
indicatif = "0.18"
owo-colors = "4.4"
supports-hyperlinks = "3.2.0"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "lexeme"
path = "src/main.rs"
