[package]
name = "lexeme"
description = "A command line tool for searching through dictionaries"
license-file = "LICENSE"
repository = "https://github.com/SrGaabriel/lexeme"
version = "0.0.2"
edition = "2024"
exclude = [".github/", "dictionaries/"]

[features]
default = []
dictgen = ["dep:serde", "dep:serde_json", "dep:flate2"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
indicatif = "0.18"
owo-colors = "4.4"
supports-hyperlinks = "3.2.0"
zstd = "0.13"

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
flate2 = { version = "1", optional = true }

[[bin]]
name = "lexeme"
path = "src/main.rs"
